<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>查詢即將上映電影</title>
</head>
<body>
  <h1>查詢即將上映的電影</h1>
  <form method="POST">
    <input type="text" name="keyword" placeholder="輸入片名關鍵字" value="{{ keyword }}">
    <button type="submit">搜尋</button>
  </form>
  <hr>

  {% if keyword and results %}
    <p>找到 {{ results|length }} 筆含有「{{ keyword }}」的電影：</p>
    {% for m in results %}
      <b>{{ m.title }}</b><br>
      <a href="{{ m.url }}" target="_blank">{{ m.url }}</a><br>
      <img src="{{ m.img }}" width="100"><br><br>
    {% endfor %}
  {% elif keyword %}
    <p>找不到含有「{{ keyword }}」的電影</p>
  {% endif %}

  <a href="/">返回首頁</a>
</body>
</html>
